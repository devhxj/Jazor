name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not push to nuget.org"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/Jazor/Jazor.csproj'
          $version = @($project.Project.PropertyGroup.Version | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })[0]

          if ([string]::IsNullOrWhiteSpace($version))
          {
              throw 'Unable to resolve <Version> from src/Jazor/Jazor.csproj.'
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'
          if ($tagVersion.StartsWith('v'))
          {
              $tagVersion = $tagVersion.Substring(1)
          }

          $packageVersion = '${{ steps.package.outputs.version }}'
          if ($tagVersion -ne $packageVersion)
          {
              throw "Tag version '$tagVersion' does not match package version '$packageVersion'."
          }

      - name: Pack Jazor
        shell: pwsh
        run: |
          pwsh './scripts/publish-nuget.ps1' `
            -Configuration Release `
            -OutputDirectory 'artifacts/packages' `
            -SkipPush

      - name: List package artifacts
        shell: pwsh
        run: |
          Get-ChildItem 'artifacts/packages' | Select-Object Name, Length

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jazor.${{ steps.package.outputs.version }}.nupkg
          path: artifacts/packages/*
          if-no-files-found: error

      - name: Ensure publish auth is configured
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        shell: pwsh
        run: |
          $apiKey = '${{ secrets.NUGET_API_KEY }}'
          $trustedUser = '${{ secrets.NUGET_USER }}'

          if ([string]::IsNullOrWhiteSpace($apiKey) -and [string]::IsNullOrWhiteSpace($trustedUser))
          {
              throw 'Configure NUGET_API_KEY or NUGET_USER before publishing to nuget.org.'
          }

      - name: NuGet trusted publishing login
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && secrets.NUGET_API_KEY == '' && secrets.NUGET_USER != '' }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package with API key
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && secrets.NUGET_API_KEY != '' }}
        shell: pwsh
        run: |
          dotnet nuget push 'artifacts/packages/*.nupkg' `
            --api-key '${{ secrets.NUGET_API_KEY }}' `
            --source 'https://api.nuget.org/v3/index.json' `
            --skip-duplicate

      - name: Push package with trusted publishing
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && secrets.NUGET_API_KEY == '' && secrets.NUGET_USER != '' }}
        shell: pwsh
        run: |
          dotnet nuget push 'artifacts/packages/*.nupkg' `
            --api-key '${{ steps.nuget_login.outputs.NUGET_API_KEY }}' `
            --source 'https://api.nuget.org/v3/index.json' `
            --skip-duplicate

      - name: Push to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        shell: pwsh
        run: |
          dotnet nuget push 'artifacts/packages/*.nupkg' `
            --api-key '${{ secrets.GITHUB_TOKEN }}' `
            --source 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json' `
            --skip-duplicate
