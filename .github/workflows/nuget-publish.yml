name: Pack NuGet Dry Run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to pack, defaults to the current branch"
        required: false
        type: string

env:
  TEMP: '${{ github.workspace }}\.tmp\agent-temp'
  TMP: '${{ github.workspace }}\.tmp\agent-temp'
  DOTNET_CLI_HOME: '${{ github.workspace }}\.dotnet'
  NUGET_PACKAGES: '${{ github.workspace }}\.dotnet\.nuget\packages\'
  NUGET_HTTP_CACHE_PATH: '${{ github.workspace }}\.tmp\nuget-http-cache'
  DENO_DIR: '${{ github.workspace }}\.tmp\deno-cache'
  NPM_CONFIG_CACHE: '${{ github.workspace }}\.tmp\npm-cache'
  npm_config_cache: '${{ github.workspace }}\.tmp\npm-cache'

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest

    steps:
      - name: Prepare repository-local toolchain directories
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}\.tmp\agent-temp", "${{ github.workspace }}\.dotnet\.nuget\packages", "${{ github.workspace }}\.tmp\nuget-http-cache", "${{ github.workspace }}\.tmp\deno-cache", "${{ github.workspace }}\.tmp\npm-cache" -Force | Out-Null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack packages
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/publish-nuget.cs -- `
            --configuration Release `
            --output-directory 'artifacts/packages' `
            --skip-push

      - name: Discover package version
        id: package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem 'artifacts/packages/*.nupkg' -Exclude '*.snupkg' |
              Where-Object { $_.BaseName -match '^Jazor\.[0-9]' } |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
          if (-not $nupkg) { throw 'No Jazor nupkg found in artifacts/packages.' }
          $version = $nupkg.BaseName.Substring('Jazor.'.Length)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: List package artifacts
        shell: pwsh
        run: |
          Get-ChildItem 'artifacts/packages' | Select-Object Name, Length

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jazor.${{ steps.package.outputs.version }}.dry-run.nupkg
          path: artifacts/packages/*
          if-no-files-found: error
