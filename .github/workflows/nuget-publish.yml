name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not push to nuget.org"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  verify-pinia:
    uses: ./.github/workflows/pinia-verify.yml

  publish:
    needs: verify-pinia
    runs-on: windows-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack Jazor
        shell: pwsh
        run: |
          pwsh './scripts/publish-nuget.ps1' `
            -Configuration Release `
            -OutputDirectory 'artifacts/packages' `
            -SkipPush

      - name: Discover package version
        id: package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem 'artifacts/packages/Jazor.*.nupkg' -Exclude '*.snupkg' |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
          if (-not $nupkg) { throw 'No Jazor nupkg found in artifacts/packages.' }
          $version = $nupkg.BaseName -replace '^Jazor\.', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: List package artifacts
        shell: pwsh
        run: |
          Get-ChildItem 'artifacts/packages' | Select-Object Name, Length

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jazor.${{ steps.package.outputs.version }}.nupkg
          path: artifacts/packages/*
          if-no-files-found: error

      - name: Ensure publish auth is configured
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY) -and [string]::IsNullOrWhiteSpace($env:NUGET_USER))
          {
              throw 'Configure NUGET_API_KEY or NUGET_USER before publishing to nuget.org.'
          }

      - name: NuGet trusted publishing login
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && env.NUGET_API_KEY == '' && env.NUGET_USER != '' }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package with API key
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && env.NUGET_API_KEY != '' }}
        shell: pwsh
        run: |
          $pkg = Get-ChildItem 'artifacts/packages/*.nupkg' -Exclude '*.snupkg' | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key '${{ secrets.NUGET_API_KEY }}' --source 'https://api.nuget.org/v3/index.json' --skip-duplicate

      - name: Push package with trusted publishing
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && env.NUGET_API_KEY == '' && env.NUGET_USER != '' }}
        shell: pwsh
        run: |
          $pkg = Get-ChildItem 'artifacts/packages/*.nupkg' -Exclude '*.snupkg' | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key '${{ steps.nuget_login.outputs.NUGET_API_KEY }}' --source 'https://api.nuget.org/v3/index.json' --skip-duplicate

      - name: Push to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        shell: pwsh
        run: |
          $pkg = Get-ChildItem 'artifacts/packages/*.nupkg' -Exclude '*.snupkg' | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key '${{ secrets.GITHUB_TOKEN }}' --source 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json' --skip-duplicate

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $prevTag = git tag --sort=-creatordate | Select-String -NotMatch "^$tag$" | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $prevTag) { $prevTag = "" }
          "prev_tag=$prevTag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.package.outputs.version }}'
          $prevTag = '${{ steps.release_notes.outputs.prev_tag }}'

          if ($prevTag) {
            $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$tag" -f previous_tag="$prevTag" --jq '.body'
          } else {
            $notes = "Release $version"
          }

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "${{ github.repository }}" --title $tag --notes $notes --latest
          } else {
            gh release create $tag --repo "${{ github.repository }}" --title $tag --notes $notes --latest
          }
