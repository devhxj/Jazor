name: Pack NuGet Dry Run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to pack, defaults to the current branch"
        required: false
        type: string

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack packages
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/publish-nuget.cs -- `
            --configuration Release `
            --output-directory 'artifacts/packages' `
            --package jazor `
            --package jazor-vue `
            --package style `
            --package admin `
            --package devtools `
            --package dataui `
            --package vu-icons `
            --package pinia `
            --package pinia-testing `
            --package vueroute `
            --package vuetify `
            --package elementplus `
            --package tdesign `
            --skip-push

      - name: Discover package version
        id: package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem 'artifacts/packages/*.nupkg' -Exclude '*.snupkg' |
              Where-Object { $_.BaseName -match '^Jazor\.[0-9]' } |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
          if (-not $nupkg) { throw 'No Jazor nupkg found in artifacts/packages.' }
          $version = $nupkg.BaseName.Substring('Jazor.'.Length)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: List package artifacts
        shell: pwsh
        run: |
          Get-ChildItem 'artifacts/packages' | Select-Object Name, Length

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jazor.${{ steps.package.outputs.version }}.dry-run.nupkg
          path: artifacts/packages/*
          if-no-files-found: error
