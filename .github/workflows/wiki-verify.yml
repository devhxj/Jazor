name: Wiki Verify

on:
  push:
    branches: [main]
    paths:
      - 'src/Wiki/**'
      - 'src/ECMAScript/**'
      - 'src/ECMAScript.Vue3/**'
      - 'src/ECMAScript.Contract/**'
      - 'src/Jazor.CLR/**'
      - 'src/Jazor.Compiler/**'
      - 'src/Jazor.Analyzer/**'
      - 'src/Jazor.Emit/**'
      - 'src/Jazor.AspNetCore/**'
      - 'src/Jazor.AspNetCore.Dev/**'
      - 'src/Jazor.Common/**'
      - 'src/Jazor/**'
      - 'Jazor.slnx'
      - 'global.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/Wiki/**'
      - 'src/ECMAScript/**'
      - 'src/ECMAScript.Vue3/**'
      - 'src/ECMAScript.Contract/**'
      - 'src/Jazor.CLR/**'
      - 'src/Jazor.Compiler/**'
      - 'src/Jazor.Analyzer/**'
      - 'src/Jazor.Emit/**'
      - 'src/Jazor.AspNetCore/**'
      - 'src/Jazor.AspNetCore.Dev/**'
      - 'src/Jazor.Common/**'
      - 'src/Jazor/**'
      - 'Jazor.slnx'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Wiki smoke verification
        shell: pwsh
        run: |
          dotnet run --file .\scripts\csharp\wiki-verify-smoke.cs -- --build --startup-timeout-seconds 60

  browser:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wiki browser verification
        shell: pwsh
        run: |
          dotnet run --file .\scripts\csharp\wiki-verify-browser.cs -- --build --startup-timeout-seconds 60 --browser-startup-timeout-seconds 20

  publish-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Wiki publish smoke verification
        shell: pwsh
        run: |
          dotnet run --file .\scripts\csharp\wiki-verify-smoke.cs -- --publish --startup-timeout-seconds 60

  publish-browser:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wiki publish browser verification
        shell: pwsh
        run: |
          dotnet run --file .\scripts\csharp\wiki-verify-browser.cs -- --publish --startup-timeout-seconds 60 --browser-startup-timeout-seconds 20
