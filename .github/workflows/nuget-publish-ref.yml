name: Publish NuGet From Ref

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref to publish from, for example v0.1.23"
        required: true
        type: string
      dry_run:
        description: "Pack only, do not push to nuget.org"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  verify-pinia:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/pinia-verify.yml

  publish:
    needs: verify-pinia
    if: ${{ always() && (github.event_name != 'push' || needs.verify-pinia.result == 'success') }}
    runs-on: windows-latest
    environment: production
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - name: Resolve release ref
        id: release_ref
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $releaseRef = '${{ inputs.release_ref }}'
            $dryRun = '${{ inputs.dry_run }}'
          } else {
            $releaseRef = '${{ github.ref_name }}'
            $dryRun = 'false'
          }

          if ([string]::IsNullOrWhiteSpace($releaseRef)) {
            throw 'Release ref could not be resolved.'
          }

          $publishEnabled = $dryRun -ne 'true'
          $createRelease = $publishEnabled -and $releaseRef.StartsWith('v', [System.StringComparison]::Ordinal)
          $packageVersion = if ($releaseRef.StartsWith('v', [System.StringComparison]::Ordinal)) { $releaseRef.Substring(1) } else { '' }
          $safeRef = $releaseRef -replace '[^A-Za-z0-9._-]', '-'

          "release_ref=$releaseRef" >> $env:GITHUB_OUTPUT
          "safe_ref=$safeRef" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "publish_enabled=$($publishEnabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "create_release=$($createRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.release_ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pack packages
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/publish-nuget.cs -- `
            --configuration Release `
            --output-directory 'artifacts/packages' `
            --package-version '${{ steps.release_ref.outputs.package_version }}' `
            --package jazor `
            --package jazor-vue `
            --package style `
            --package admin `
            --package devtools `
            --package dataui `
            --package pinia `
            --package pinia-testing `
            --package vueroute `
            --package vuetify `
            --package elementplus `
            --package tdesign `
            --skip-push

      - name: Verify packaged Windows SPA release consumer
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/verify-windows-spa-release.cs -- `
            --package-source 'artifacts/packages' `
            --skip-pack `
            --path-base /docs `
            --startup-timeout-seconds 60 `
            --browser-startup-timeout-seconds 20

      - name: Discover package version
        id: package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem 'artifacts/packages/Jazor.*.nupkg' -Exclude '*.snupkg' |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
          if (-not $nupkg) { throw 'No Jazor nupkg found in artifacts/packages.' }
          $version = $nupkg.BaseName -replace '^Jazor\.', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: List package artifacts
        shell: pwsh
        run: |
          Get-ChildItem 'artifacts/packages' | Select-Object Name, Length

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jazor.${{ steps.package.outputs.version }}.${{ steps.release_ref.outputs.safe_ref }}.nupkg
          path: artifacts/packages/*
          if-no-files-found: error

      - name: Ensure publish auth is configured
        if: ${{ steps.release_ref.outputs.publish_enabled == 'true' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY) -and [string]::IsNullOrWhiteSpace($env:NUGET_USER))
          {
              throw 'Configure NUGET_API_KEY or NUGET_USER before publishing to nuget.org.'
          }

      - name: NuGet trusted publishing login
        if: ${{ steps.release_ref.outputs.publish_enabled == 'true' && env.NUGET_USER != '' }}
        id: nuget_login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package with trusted publishing
        if: ${{ steps.release_ref.outputs.publish_enabled == 'true' && steps.nuget_login.outcome == 'success' }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem 'artifacts/packages/*.nupkg' -Exclude '*.snupkg' | Sort-Object Name
          if (-not $packages) { throw 'No packages found in artifacts/packages.' }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName --api-key '${{ steps.nuget_login.outputs.NUGET_API_KEY }}' --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          }

      - name: Push package with API key fallback
        if: ${{ steps.release_ref.outputs.publish_enabled == 'true' && steps.nuget_login.outcome != 'success' && env.NUGET_API_KEY != '' }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem 'artifacts/packages/*.nupkg' -Exclude '*.snupkg' | Sort-Object Name
          if (-not $packages) { throw 'No packages found in artifacts/packages.' }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName --api-key '${{ secrets.NUGET_API_KEY }}' --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          }

      - name: Push to GitHub Packages
        if: ${{ steps.release_ref.outputs.publish_enabled == 'true' }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem 'artifacts/packages/*.nupkg' -Exclude '*.snupkg' | Sort-Object Name
          if (-not $packages) { throw 'No packages found in artifacts/packages.' }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName --api-key '${{ secrets.GITHUB_TOKEN }}' --source 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json' --skip-duplicate
          }

      - name: Generate release notes
        if: ${{ steps.release_ref.outputs.create_release == 'true' }}
        id: release_notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null
          $notesPath = Join-Path (Resolve-Path 'artifacts') 'release-notes.md'
          dotnet run --file ./scripts/csharp/release-notes.cs -- `
            --tag '${{ steps.release_ref.outputs.release_ref }}' `
            --repository '${{ github.repository }}' |
            Set-Content -LiteralPath $notesPath -Encoding UTF8
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ steps.release_ref.outputs.create_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release_ref.outputs.release_ref }}'
          $notesPath = '${{ steps.release_notes.outputs.notes_path }}'

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "${{ github.repository }}" --title $tag --notes-file $notesPath --latest
          } else {
            gh release create $tag --repo "${{ github.repository }}" --title $tag --notes-file $notesPath --latest
          }
