name: Pinia Verify

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/ECMAScript.Pinia/**'
      - 'src/ECMAScript.Pinia.Test/**'
      - 'src/ECMAScript.Pinia.Testing/**'
      - 'src/ECMAScript.Pinia.Testing.Test/**'
      - 'src/ECMAScript.Vue3/**'
      - 'src/ECMAScript.VueRoute/**'
      - 'src/ECMAScript/**'
      - 'src/Jazor/**'
      - 'src/Jazor.Analyzer/**'
      - 'src/Jazor.Common/**'
      - 'src/Jazor.Compiler/**'
      - 'src/Jazor.Emit/**'
      - 'src/Jazor.RazorVue/**'
      - 'samples/ECMAScript.Pinia.Counter/**'
      - 'scripts/csharp/publish-nuget.cs'
      - 'scripts/csharp/test-dotnet.cs'
      - 'Jazor.slnx'
      - 'global.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/ECMAScript.Pinia/**'
      - 'src/ECMAScript.Pinia.Test/**'
      - 'src/ECMAScript.Pinia.Testing/**'
      - 'src/ECMAScript.Pinia.Testing.Test/**'
      - 'src/ECMAScript.Vue3/**'
      - 'src/ECMAScript.VueRoute/**'
      - 'src/ECMAScript/**'
      - 'src/Jazor/**'
      - 'src/Jazor.Analyzer/**'
      - 'src/Jazor.Common/**'
      - 'src/Jazor.Compiler/**'
      - 'src/Jazor.Emit/**'
      - 'src/Jazor.RazorVue/**'
      - 'samples/ECMAScript.Pinia.Counter/**'
      - 'scripts/csharp/publish-nuget.cs'
      - 'scripts/csharp/test-dotnet.cs'
      - 'Jazor.slnx'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify ECMAScript.Pinia
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/test-dotnet.cs -- `
            --project pinia `
            --configuration Release `
            --base-output-path 'artifacts/out/pinia/' `
            --base-intermediate-output-path 'artifacts/obj/pinia/'

      - name: Verify ECMAScript.Pinia.Testing
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/test-dotnet.cs -- `
            --project pinia-testing `
            --configuration Release `
            --base-output-path 'artifacts/out/pinia-testing/' `
            --base-intermediate-output-path 'artifacts/obj/pinia-testing/'

  sample-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify sample smoke
        shell: pwsh
        run: |
          dotnet run --file ./samples/ECMAScript.Pinia.Counter/verify-smoke.cs -- `
            -Configuration Release `
            -BaseOutputPath 'artifacts/out/pinia-sample/' `
            -BaseIntermediateOutputPath 'artifacts/obj/pinia-sample/'

  package-dry-run:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack Jazor
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/publish-nuget.cs -- `
            --configuration Release `
            --output-directory artifacts/packages `
            --skip-push `
            --base-output-path 'artifacts/out/pinia-pack/' `
            --base-intermediate-output-path 'artifacts/obj/pinia-pack/'

      - name: Pack Jazor (NoBuild fast path)
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/publish-nuget.cs -- `
            --configuration Release `
            --output-directory artifacts/packages-nobuild `
            --skip-push `
            --no-build `
            --base-output-path 'artifacts/out/pinia-pack/' `
            --base-intermediate-output-path 'artifacts/obj/pinia-pack/'

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinia-jazor-packages
          path: |
            artifacts/packages/*
            artifacts/packages-nobuild/*
          if-no-files-found: error
