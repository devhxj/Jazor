name: Pinia Verify

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/ECMAScript.Pinia/**'
      - 'src/ECMAScript.Pinia.Test/**'
      - 'src/ECMAScript.Pinia.Testing/**'
      - 'src/ECMAScript.Pinia.Testing.Test/**'
      - 'src/ECMAScript.Vue.Devtools/**'
      - 'src/ECMAScript.Vue.Devtools.Test/**'
      - 'src/ECMAScript.VueDataUi/**'
      - 'src/ECMAScript.VueDataUi.Test/**'
      - 'src/ECMAScript.Lucide/**'
      - 'src/ECMAScript.Lucide.Test/**'
      - 'src/ECMAScript.Vue/**'
      - 'src/ECMAScript.VueRoute/**'
      - 'src/ECMAScript/**'
      - 'src/Jazor/**'
      - 'src/Jazor.Analyzer/**'
      - 'src/Jazor.Common/**'
      - 'src/Jazor.Compiler/**'
      - 'src/Jazor.Emit/**'
      - 'src/Jazor.RazorVue/**'
      - 'src/Jazor.Vue/**'
      - 'samples/ECMAScript.Pinia.Counter/**'
      - 'samples/ECMAScript.Vue.Devtools.Plugin/**'
      - 'samples/ECMAScript.VueDataUi.Dashboard/**'
      - 'scripts/csharp/publish-nuget.cs'
      - 'scripts/csharp/test-dotnet.cs'
      - 'scripts/csharp/verify-vue-binding-coverage.cs'
      - 'Jazor.slnx'
      - 'global.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/ECMAScript.Pinia/**'
      - 'src/ECMAScript.Pinia.Test/**'
      - 'src/ECMAScript.Pinia.Testing/**'
      - 'src/ECMAScript.Pinia.Testing.Test/**'
      - 'src/ECMAScript.Vue.Devtools/**'
      - 'src/ECMAScript.Vue.Devtools.Test/**'
      - 'src/ECMAScript.VueDataUi/**'
      - 'src/ECMAScript.VueDataUi.Test/**'
      - 'src/ECMAScript.Lucide/**'
      - 'src/ECMAScript.Lucide.Test/**'
      - 'src/ECMAScript.Vue/**'
      - 'src/ECMAScript.VueRoute/**'
      - 'src/ECMAScript/**'
      - 'src/Jazor/**'
      - 'src/Jazor.Analyzer/**'
      - 'src/Jazor.Common/**'
      - 'src/Jazor.Compiler/**'
      - 'src/Jazor.Emit/**'
      - 'src/Jazor.RazorVue/**'
      - 'src/Jazor.Vue/**'
      - 'samples/ECMAScript.Pinia.Counter/**'
      - 'samples/ECMAScript.Vue.Devtools.Plugin/**'
      - 'samples/ECMAScript.VueDataUi.Dashboard/**'
      - 'scripts/csharp/publish-nuget.cs'
      - 'scripts/csharp/test-dotnet.cs'
      - 'scripts/csharp/verify-vue-binding-coverage.cs'
      - 'Jazor.slnx'
      - 'global.json'
  workflow_dispatch:

env:
  TEMP: '${{ github.workspace }}\.tmp\agent-temp'
  TMP: '${{ github.workspace }}\.tmp\agent-temp'
  DOTNET_CLI_HOME: '${{ github.workspace }}\.dotnet'
  NUGET_PACKAGES: '${{ github.workspace }}\.dotnet\.nuget\packages\'
  NUGET_HTTP_CACHE_PATH: '${{ github.workspace }}\.tmp\nuget-http-cache'
  DENO_DIR: '${{ github.workspace }}\.tmp\deno-cache'
  NPM_CONFIG_CACHE: '${{ github.workspace }}\.tmp\npm-cache'
  npm_config_cache: '${{ github.workspace }}\.tmp\npm-cache'

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - name: Prepare repository-local toolchain directories
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}\.tmp\agent-temp", "${{ github.workspace }}\.dotnet\.nuget\packages", "${{ github.workspace }}\.tmp\nuget-http-cache", "${{ github.workspace }}\.tmp\deno-cache", "${{ github.workspace }}\.tmp\npm-cache" -Force | Out-Null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify ECMAScript.Pinia
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/test-dotnet.cs -- `
            --project pinia `
            --configuration Release `
            --base-output-path 'artifacts/out/pinia/' `
            --base-intermediate-output-path 'artifacts/obj/pinia/'

      - name: Verify ECMAScript.Pinia.Testing
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/test-dotnet.cs -- `
            --project pinia-testing `
            --configuration Release `
            --base-output-path 'artifacts/out/pinia-testing/' `
            --base-intermediate-output-path 'artifacts/obj/pinia-testing/'

      - name: Verify ECMAScript.Vue.Devtools
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/test-dotnet.cs -- `
            --project devtools `
            --configuration Release `
            --base-output-path 'artifacts/out/devtools/' `
            --base-intermediate-output-path 'artifacts/obj/devtools/'

      - name: Verify ECMAScript.VueDataUi
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/test-dotnet.cs -- `
            --project dataui `
            --configuration Release `
            --base-output-path 'artifacts/out/dataui/' `
            --base-intermediate-output-path 'artifacts/obj/dataui/'

      - name: Verify ECMAScript.Lucide
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/test-dotnet.cs -- `
            --project lucide `
            --configuration Release `
            --base-output-path 'artifacts/out/lucide/' `
            --base-intermediate-output-path 'artifacts/obj/lucide/'

  sample-smoke:
    runs-on: windows-latest
    steps:
      - name: Prepare repository-local toolchain directories
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}\.tmp\agent-temp", "${{ github.workspace }}\.dotnet\.nuget\packages", "${{ github.workspace }}\.tmp\nuget-http-cache", "${{ github.workspace }}\.tmp\deno-cache", "${{ github.workspace }}\.tmp\npm-cache" -Force | Out-Null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify sample smoke
        shell: pwsh
        run: |
          dotnet run --file ./samples/ECMAScript.Pinia.Counter/verify-smoke.cs -- `
            -Configuration Release `
            -BaseOutputPath 'artifacts/out/pinia-sample/' `
            -BaseIntermediateOutputPath 'artifacts/obj/pinia-sample/'

      - name: Verify Devtools NuGet consumer smoke
        shell: pwsh
        run: |
          dotnet run --file ./samples/ECMAScript.Vue.Devtools.Plugin/build-local.cs -- `
            --configuration Release

      - name: Verify Vue Data UI NuGet consumer smoke
        shell: pwsh
        run: |
          dotnet run --file ./samples/ECMAScript.VueDataUi.Dashboard/build-local.cs -- `
            --configuration Release

  package-dry-run:
    runs-on: windows-latest
    steps:
      - name: Prepare repository-local toolchain directories
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}\.tmp\agent-temp", "${{ github.workspace }}\.dotnet\.nuget\packages", "${{ github.workspace }}\.tmp\nuget-http-cache", "${{ github.workspace }}\.tmp\deno-cache", "${{ github.workspace }}\.tmp\npm-cache" -Force | Out-Null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack default public package set
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/publish-nuget.cs -- `
            --configuration Release `
            --output-directory artifacts/packages `
            --skip-push `
            --base-output-path 'artifacts/out/pinia-pack/' `
            --base-intermediate-output-path 'artifacts/obj/pinia-pack/'

      - name: Pack default public package set (NoBuild fast path)
        shell: pwsh
        run: |
          dotnet run --file ./scripts/csharp/publish-nuget.cs -- `
            --configuration Release `
            --output-directory artifacts/packages-nobuild `
            --skip-push `
            --no-build `
            --base-output-path 'artifacts/out/pinia-pack/' `
            --base-intermediate-output-path 'artifacts/obj/pinia-pack/'

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinia-jazor-packages
          path: |
            artifacts/packages/*
            artifacts/packages-nobuild/*
          if-no-files-found: error
