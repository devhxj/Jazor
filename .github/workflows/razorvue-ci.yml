name: RazorVue CI

# Gate 5 of the RazorVue production-readiness gates (completion-analysis.md):
# wire the RazorVue test suites (including the browser-smoke E2E that lives inside
# Jazor.EmitTest SDK integration tests) into the upper CI pipeline. Previously the
# browser smoke and pure-Deno consumer tests only ran as focused integration tests,
# not in CI.

on:
  push:
    branches: [main]
    paths:
      - 'src/Jazor.RazorVue/**'
      - 'src/Jazor.RazorVue.Sg.Test/**'
      - 'src/Jazor.Emit/**'
      - 'src/Jazor.EmitTest/**'
      - 'src/Jazor.Analyzer/**'
      - 'src/Jazor.Compiler/**'
      - 'src/Jazor.Common/**'
      - 'src/ECMAScript/**'
      - 'src/ECMAScript.Vue3/**'
      - 'src/ECMAScript.VueContract/**'
      - 'src/ECMAScript.VueRoute/**'
      - 'src/ECMAScript.Vuetify/**'
      - 'src/ECMAScript.TDesign/**'
      - 'src/Jazor/**'
      - 'src/Jazor.Admin/**'
      - 'samples/JazorAdmin/**'
      - 'samples/JazorAdmin.Test/**'
      - 'samples/Sample.slnx'
      - 'Jazor.slnx'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/razorvue-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Jazor.RazorVue/**'
      - 'src/Jazor.RazorVue.Sg.Test/**'
      - 'src/Jazor.Emit/**'
      - 'src/Jazor.EmitTest/**'
      - 'src/Jazor.Analyzer/**'
      - 'src/Jazor.Compiler/**'
      - 'src/Jazor.Common/**'
      - 'src/ECMAScript/**'
      - 'src/ECMAScript.Vue3/**'
      - 'src/ECMAScript.VueContract/**'
      - 'src/ECMAScript.VueRoute/**'
      - 'src/ECMAScript.Vuetify/**'
      - 'src/ECMAScript.TDesign/**'
      - 'src/Jazor/**'
      - 'src/Jazor.Admin/**'
      - 'samples/JazorAdmin/**'
      - 'samples/JazorAdmin.Test/**'
      - 'samples/Sample.slnx'
      - 'Jazor.slnx'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/razorvue-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  razorvue-test:
    name: Razor SG final-document boundary
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore Jazor.slnx

      - name: Build
        shell: pwsh
        run: dotnet build Jazor.slnx --no-restore -v minimal

      - name: Razor SG final-document tests
        shell: pwsh
        run: dotnet test src/Jazor.RazorVue.Sg.Test/Jazor.RazorVue.Sg.Test.csproj --no-build -v minimal

  emit-and-browser-smoke:
    # Jazor.EmitTest contains SDK integration, package-payload guards, and
    # end-to-end browser smoke coverage for the current RazorVue artifact contract.
    name: Emit + SDK integration + browser smoke E2E
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore Jazor.slnx

      - name: Build
        shell: pwsh
        run: dotnet build Jazor.slnx --no-restore -v minimal

      - name: Emit + SDK integration tests (includes browser smoke E2E)
        shell: pwsh
        run: dotnet test src/Jazor.EmitTest/Jazor.EmitTest.csproj --no-build -v minimal
