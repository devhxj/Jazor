name: RazorVue CI

# Gate 5 of the RazorVue production-readiness gates (completion-analysis.md):
# wire the RazorVue test suites (including the browser-smoke E2E that lives inside
# Jazor.EmitTest SDK integration tests) into the upper CI pipeline. Previously the
# browser smoke and pure-Deno consumer tests only ran as focused integration tests,
# not in CI.

on:
  push:
    branches: [main]
    paths:
      - 'src/Jazor*/**'
      - 'src/ECMAScript*/**'
      - 'samples/JazorAdmin/**'
      - 'samples/JazorAdmin.Test/**'
      - 'samples/Sample.slnx'
      - 'scripts/csharp/test-dotnet.cs'
      - 'Jazor.slnx'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/razorvue-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Jazor*/**'
      - 'src/ECMAScript*/**'
      - 'samples/JazorAdmin/**'
      - 'samples/JazorAdmin.Test/**'
      - 'samples/Sample.slnx'
      - 'scripts/csharp/test-dotnet.cs'
      - 'Jazor.slnx'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/razorvue-ci.yml'
  workflow_dispatch:

env:
  TEMP: '${{ github.workspace }}\.tmp\agent-temp'
  TMP: '${{ github.workspace }}\.tmp\agent-temp'
  DOTNET_CLI_HOME: '${{ github.workspace }}\.dotnet'
  NUGET_PACKAGES: '${{ github.workspace }}\.dotnet\.nuget\packages\'
  NUGET_HTTP_CACHE_PATH: '${{ github.workspace }}\.tmp\nuget-http-cache'
  DENO_DIR: '${{ github.workspace }}\.tmp\deno-cache'
  NPM_CONFIG_CACHE: '${{ github.workspace }}\.tmp\npm-cache'

permissions:
  contents: read

jobs:
  razorvue-test:
    name: Razor SG final-document boundary
    runs-on: windows-latest
    steps:
      - name: Prepare repository-local toolchain directories
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}\.tmp\agent-temp", "${{ github.workspace }}\.dotnet\.nuget\packages", "${{ github.workspace }}\.tmp\nuget-http-cache", "${{ github.workspace }}\.tmp\deno-cache", "${{ github.workspace }}\.tmp\npm-cache" -Force | Out-Null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore Jazor.slnx

      - name: Build
        shell: pwsh
        run: dotnet build Jazor.slnx --no-restore -v minimal

      - name: Razor SG final-document tests
        shell: pwsh
        run: dotnet test src/Jazor.RazorVue.Sg.Test/Jazor.RazorVue.Sg.Test.csproj --no-build -v minimal

  emit-consumer:
    # Each lane owns one package fixture family. This keeps failures local and lets
    # GitHub run package, core, style, and release/browser evidence concurrently.
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: Emit regression tests
            project: emit
          - name: Debug package consumers
            project: emit-consumer-packages
          - name: Style package consumers
            project: emit-consumer-style
          - name: Core SDK and RazorVue consumers
            project: emit-consumer-core
          - name: Release browser consumers
            project: emit-consumer-release
    steps:
      - name: Prepare repository-local toolchain directories
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}\.tmp\agent-temp", "${{ github.workspace }}\.dotnet\.nuget\packages", "${{ github.workspace }}\.tmp\nuget-http-cache", "${{ github.workspace }}\.tmp\deno-cache", "${{ github.workspace }}\.tmp\npm-cache" -Force | Out-Null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run ${{ matrix.name }}
        shell: pwsh
        run: dotnet run --file ./scripts/csharp/test-dotnet.cs -- --project ${{ matrix.project }}
