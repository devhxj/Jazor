name: Quality Gates

on:
  workflow_call:
    inputs:
      release_ref:
        description: Git ref to verify; empty uses the triggering ref
        required: false
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    # Keep the compatibility and coverage baseline fresh even when main is quiet.
    - cron: '0 2 * * 1'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/csharp/run-quality-gate.cs'
      - 'scripts/csharp/verify-*-coverage.cs'
      - 'scripts/csharp/inspect-public-api.cs'
      - 'scripts/csharp/compare-public-api.cs'
      - 'scripts/csharp/verify-typed-bootstrap.cs'
      - 'Jazor.slnx'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'global.json'
      - 'NuGet.config'
      - '.github/workflows/quality-gates.yml'
      - '.github/workflows/nuget-publish-ref.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/csharp/run-quality-gate.cs'
      - 'scripts/csharp/verify-*-coverage.cs'
      - 'scripts/csharp/inspect-public-api.cs'
      - 'scripts/csharp/compare-public-api.cs'
      - 'scripts/csharp/verify-typed-bootstrap.cs'
      - 'Jazor.slnx'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'global.json'
      - 'NuGet.config'
      - '.github/workflows/quality-gates.yml'
      - '.github/workflows/nuget-publish-ref.yml'

permissions:
  contents: read

jobs:
  toolchain:
    name: Toolchain matrix
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Record toolchain matrix
        shell: pwsh
        run: dotnet run --file ./scripts/csharp/write-toolchain-matrix.cs -- artifacts/quality/toolchain-matrix.md

      - name: Upload toolchain matrix
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-matrix-${{ github.run_attempt }}
          path: artifacts/quality/toolchain-matrix.md
          if-no-files-found: error

  coverage:
    name: Coverage (${{ matrix.gate }})
    runs-on: windows-latest
    strategy:
      # Keep evidence from the other gates even when one gate fails.
      fail-fast: false
      matrix:
        gate: [compiler, razorvue, vue-bindings]
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      # Manual publishing may test an older ref without this reporting entrypoint.
      # Use the workflow's tooling while all test/build inputs remain at the tested ref.
      - name: Checkout reporting tool from workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/quality-tools
          sparse-checkout: scripts/csharp/run-quality-gate.cs
          sparse-checkout-cone-mode: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run coverage gate and write summary
        shell: pwsh
        run: dotnet run --file ./.tmp/quality-tools/scripts/csharp/run-quality-gate.cs -- ${{ matrix.gate }}

      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.gate }}-${{ github.run_attempt }}
          path: artifacts/quality/${{ matrix.gate }}/
          if-no-files-found: error
          retention-days: 14

  public-api:
    name: Public API snapshot
    runs-on: windows-latest
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build public API assemblies
        shell: pwsh
        run: dotnet build Jazor.slnx --no-restore

      - name: Generate public API snapshot
        shell: pwsh
        run: dotnet run --file ./scripts/csharp/inspect-public-api.cs -- --output artifacts/quality/public-api/public-api.md

      - name: Check for checked-in candidate baseline
        shell: pwsh
        run: dotnet run --file ./scripts/csharp/compare-public-api.cs -- --current artifacts/quality/public-api/public-api.md --baseline docs/03-guides/public-api-baseline.snapshot.md --output artifacts/quality/public-api/public-api-compatibility.md

      - name: Upload public API evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: public-api-${{ github.run_attempt }}
          path: artifacts/quality/public-api/
          if-no-files-found: error
          retention-days: 14

  typed-bootstrap:
    name: Typed bootstrap consumer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify typed bootstrap contract
        shell: pwsh
        run: dotnet run --file ./scripts/csharp/verify-typed-bootstrap.cs -- --report artifacts/quality/typed-bootstrap/report.md

      - name: Upload typed bootstrap evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: typed-bootstrap-${{ github.run_attempt }}
          path: artifacts/quality/typed-bootstrap/
          if-no-files-found: error
          retention-days: 14
