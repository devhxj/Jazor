name: Update Today's Verse

on:
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Shanghai.
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: readme-verse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch the verse and update both READMEs
        run: dotnet run --file scripts/csharp/update-readme-verse.cs -- --commit
