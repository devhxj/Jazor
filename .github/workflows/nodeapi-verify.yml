name: Verify Embedded NodeApi

on:
  workflow_dispatch:
  push:
    branches: [main, feature/webidl-node-pnpm]
    paths:
      - .github/workflows/nodeapi-verify.yml
      - Directory.Build.props
      - src/Jazor.NodeHost/**
      - src/Jazor.Emit/**
      - src/Jazor/**
      - src/Jazor.EmitTest/**
      - src/Jazor.AspNetCore/**
      - src/ECMAScript.WebIDL.Generator/**
      - scripts/csharp/verify-*-nodeapi.cs
      - scripts/csharp/verify-nodeapi-pipeline.cs

permissions:
  contents: read

jobs:
  embedded:
    name: NodeApi / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Vite API lifecycle and same-process evidence
        run: dotnet run --file scripts/csharp/verify-vite-nodeapi.cs
      - name: Restore, build and runtime-only SSR deployment
        run: dotnet run --file scripts/csharp/verify-nodeapi-pipeline.cs
      - name: Async failure propagation and environment cancellation
        run: dotnet test src/Jazor.CompilerTest/Jazor.CompilerTest.csproj --filter FullyQualifiedName~NodeModuleRunnerTests --nologo -v minimal
      - name: ASP.NET Core Vite proxy, SSR pool and tool cancellation
        run: dotnet test src/Jazor.EmitTest/Jazor.EmitTest.csproj --filter "(FullyQualifiedName~JazorViteProxyTests|FullyQualifiedName~JazorSsrHostingTests|FullyQualifiedName~EmitProgressTests|FullyQualifiedName~StandardPackageProjectTests)&TestCategory!=Browser" --nologo -v minimal
      - name: NuGet runtime and build-host asset closure
        run: dotnet test src/Jazor.EmitTest/Jazor.EmitTest.csproj --no-build --filter FullyQualifiedName~CreateLocalPackage_CarriesNodeApiRuntimeAndFrontendHost --nologo -v minimal
      - name: WebIDL collector and generated output parity
        run: dotnet run --file scripts/csharp/verify-webidl-nodeapi.cs
      - name: Preserve failed package closure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nodeapi-packages-${{ matrix.os }}
          path: .tmp/Jazor.EmitTest/debug-core-nupkg/**/*.nupkg
          retention-days: 3
